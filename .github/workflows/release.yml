name: Release

concurrency:
  group: raeburn-talent-release
  cancel-in-progress: true
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to release
        required: false
        type: string

permissions:
  actions: write
  contents: write
  packages: write
  id-token: write

env:
  UNIT_IMAGE: ghcr.io/raebu/raeburn-talent-unit
  SCANNER_IMAGE: ghcr.io/raebu/raeburn-talent-malware-scanner

jobs:
  qualify:
    if: vars.RELEASE_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - id: sha
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: echo "value=${REQUESTED_SHA:-${WORKFLOW_SHA:-$FALLBACK_SHA}}" >> "$GITHUB_OUTPUT"
      - name: Cancel stale Release runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for state in in_progress queued; do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&status=${state}&per_page=100")
            mapfile -t ids < <(printf '%s' "$result" | jq -r --arg current "$CURRENT_RUN_ID" '.workflow_runs[] | select((.id|tostring) != $current) | .id')
            for id in "${ids[@]}"; do
              echo "Cancelling stale Release run $id..."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            done
          done
      - name: Require matching Security workflow success
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/security.yml/runs" -f branch=main -f head_sha="$SHA" -f per_page=20)
            conclusion=$(printf '%s' "$result" | jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].conclusion // ""')
            status=$(printf '%s' "$result" | jq -r '.workflow_runs | sort_by(.created_at) | reverse | .[0].status // ""')
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$status" = "completed" ] && [ -n "$conclusion" ]; then echo "Security workflow failed: $conclusion"; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for Security workflow for $SHA"
          exit 1

  image:
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      unit_image_ref: ${{ steps.deployrefs.outputs.unit_image_ref }}
      scanner_image_ref: ${{ steps.deployrefs.outputs.scanner_image_ref }}
      unit_image_digest: ${{ steps.immutable.outputs.unit_image_digest }}
      scanner_image_digest: ${{ steps.immutable.outputs.scanner_image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and push immutable deployment images
        run: |
          docker build -f infrastructure/production/Dockerfile.unit -t "$UNIT_IMAGE:${{ needs.qualify.outputs.sha }}" .
          docker build -f infrastructure/production/Dockerfile.malware-scanner -t "$SCANNER_IMAGE:${{ needs.qualify.outputs.sha }}" .
          docker push "$UNIT_IMAGE:${{ needs.qualify.outputs.sha }}"
          docker push "$SCANNER_IMAGE:${{ needs.qualify.outputs.sha }}"
      - id: immutable
        name: Resolve immutable digests
        shell: bash
        run: |
          unit_digest=$(docker buildx imagetools inspect "$UNIT_IMAGE:${{ needs.qualify.outputs.sha }}" --format '{{.Manifest.Digest}}')
          scanner_digest=$(docker buildx imagetools inspect "$SCANNER_IMAGE:${{ needs.qualify.outputs.sha }}" --format '{{.Manifest.Digest}}')
          test -n "$unit_digest" && test -n "$scanner_digest"
          echo "unit_image_digest=$UNIT_IMAGE@$unit_digest" >> "$GITHUB_OUTPUT"
          echo "scanner_image_digest=$SCANNER_IMAGE@$scanner_digest" >> "$GITHUB_OUTPUT"
      - id: deployrefs
        name: Resolve deployment tags
        shell: bash
        run: |
          echo "unit_image_ref=$UNIT_IMAGE:${{ needs.qualify.outputs.sha }}" >> "$GITHUB_OUTPUT"
          echo "scanner_image_ref=$SCANNER_IMAGE:${{ needs.qualify.outputs.sha }}" >> "$GITHUB_OUTPUT"
      - name: Sign immutable images
        run: |
          cosign sign --yes "${{ steps.immutable.outputs.unit_image_digest }}"
          cosign sign --yes "${{ steps.immutable.outputs.scanner_image_digest }}"
      - name: Export deployment images
        run: |
          docker save "$UNIT_IMAGE:${{ needs.qualify.outputs.sha }}" "$SCANNER_IMAGE:${{ needs.qualify.outputs.sha }}" | gzip -1 > release-images.tar.gz
          test -s release-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ needs.qualify.outputs.sha }}
          path: release-images.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  staging:
    needs: [qualify,image]
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-images-${{ needs.qualify.outputs.sha }}
          path: release-images
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          version: "1.177.0"
      - name: Discover staging runtime addresses
        env:
          DATABASE_RUNTIME_PASSWORD: ${{ secrets.DATABASE_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          read runtime runtime_private <<< "$(doctl compute droplet list --format Name,PublicIPv4,PrivateIPv4 --no-header | awk '$1=="raeburn-talent-staging-runtime"{print $2, $3}')"
          read nats_public nats <<< "$(doctl compute droplet list --format Name,PublicIPv4,PrivateIPv4 --no-header | awk '$1=="raeburn-talent-staging-nats"{print $2, $3}')"
          dbid=$(doctl databases list --format ID,Name --no-header | awk '$2=="raeburn-talent-staging-postgres"{print $1}')
          read dbhost dbport <<< "$(doctl databases connection "$dbid" --private --format Host,Port --no-header)"
          test -n "$runtime" && test -n "$runtime_private" && test -n "$nats_public" && test -n "$nats" && test -n "$dbhost" && test -n "$dbport"
          encoded=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["DATABASE_RUNTIME_PASSWORD"], safe=""))
          PY
          )
          dburl="postgresql://talent_runtime:${encoded}@${dbhost}:${dbport}?sslmode=require&uselibpqcompat=true"
          echo "::add-mask::$dburl"
          echo "DEPLOY_HOST=$runtime" >> "$GITHUB_ENV"
          echo "RUNTIME_PRIVATE_IP=$runtime_private" >> "$GITHUB_ENV"
          echo "NATS_DEPLOY_HOST=$nats_public" >> "$GITHUB_ENV"
          echo "DATABASE_BASE_URL_OVERRIDE=$dburl" >> "$GITHUB_ENV"
          echo "NATS_URL_OVERRIDE=nats://$nats:4222" >> "$GITHUB_ENV"
      - name: Repair staging NATS path and open deploy-only SSH access
        env:
          NATS_DEPLOY_HOST: ${{ env.NATS_DEPLOY_HOST }}
          RUNTIME_PRIVATE_IP: ${{ env.RUNTIME_PRIVATE_IP }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_FINGERPRINT: MD5:40:5c:b9:ce:22:0e:16:26:48:09:0e:71:09:69:77:a5
        run: |
          set -euo pipefail
          ip=$(curl -fsS https://api.ipify.org)
          runtime_fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-staging-runtime-fw"{print $1}')
          nats_fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-staging-nats-fw"{print $1}')
          test -n "$runtime_fw" && test -n "$nats_fw"
          doctl compute firewall add-rules "$runtime_fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          doctl compute firewall add-rules "$nats_fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          doctl compute firewall add-rules "$nats_fw" --inbound-rules "protocol:tcp,ports:4222,address:$RUNTIME_PRIVATE_IP/32"
          doctl compute firewall add-rules "$nats_fw" --outbound-rules "protocol:tcp,ports:443,address:0.0.0.0/0,address6:::/0"
          doctl compute firewall add-rules "$nats_fw" --outbound-rules "protocol:udp,ports:53,address:0.0.0.0/0,address6:::/0"
          doctl compute firewall add-rules "$nats_fw" --outbound-rules "protocol:tcp,ports:53,address:0.0.0.0/0,address6:::/0"
          bash scripts/ensure-nats.sh
      - name: Deploy immutable release to staging
        timeout-minutes: 30
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: root
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_FINGERPRINT: MD5:40:5c:b9:ce:22:0e:16:26:48:09:0e:71:09:69:77:a5
          DATABASE_BASE_URL_OVERRIDE: ${{ env.DATABASE_BASE_URL_OVERRIDE }}
          NATS_URL_OVERRIDE: ${{ env.NATS_URL_OVERRIDE }}
          RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}
          PUBLIC_BASE_URL: https://api-staging-talent.theraeburngroup.com
          UNIT_IMAGE_REF: ${{ needs.image.outputs.unit_image_ref }}
          SCANNER_IMAGE_REF: ${{ needs.image.outputs.scanner_image_ref }}
          IMAGE_ARCHIVE: release-images/release-images.tar.gz
          DEPLOY_RELEASE_ID: ${{ github.run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-ssh.sh
      - name: Close deploy-only SSH access
        if: always()
        run: |
          set +e
          ip=$(curl -fsS https://api.ipify.org)
          runtime_fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-staging-runtime-fw"{print $1}')
          nats_fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-staging-nats-fw"{print $1}')
          [ -n "$runtime_fw" ] && doctl compute firewall remove-rules "$runtime_fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          [ -n "$nats_fw" ] && doctl compute firewall remove-rules "$nats_fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          exit 0
      - name: Staging smoke test
        env:
          SMOKE_BASE_URL: https://api-staging-talent.theraeburngroup.com
        run: node scripts/release-smoke.mjs
      - name: Staging DAST baseline
        if: vars.DAST_ON_RELEASE == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: https://api-staging-talent.theraeburngroup.com
          fail_action: true
          allow_issue_writing: false

  production:
    if: vars.PRODUCTION_ENABLED == 'true'
    needs: [qualify,image,staging]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-images-${{ needs.qualify.outputs.sha }}
          path: release-images
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          version: "1.177.0"
      - name: Discover production runtime addresses
        env:
          DATABASE_RUNTIME_PASSWORD: ${{ secrets.DATABASE_RUNTIME_PASSWORD }}
        run: |
          set -euo pipefail
          runtime=$(doctl compute droplet list --format Name,PublicIPv4,PrivateIPv4 --no-header | awk '$1=="raeburn-talent-production-runtime"{print $2}')
          nats=$(doctl compute droplet list --format Name,PublicIPv4,PrivateIPv4 --no-header | awk '$1=="raeburn-talent-production-nats"{print $3}')
          dbid=$(doctl databases list --format ID,Name --no-header | awk '$2=="raeburn-talent-production-postgres"{print $1}')
          read dbhost dbport <<< "$(doctl databases connection "$dbid" --private --format Host,Port --no-header)"
          test -n "$runtime" && test -n "$nats" && test -n "$dbhost" && test -n "$dbport"
          encoded=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["DATABASE_RUNTIME_PASSWORD"], safe=""))
          PY
          )
          dburl="postgresql://talent_runtime:${encoded}@${dbhost}:${dbport}?sslmode=require&uselibpqcompat=true"
          echo "::add-mask::$dburl"
          echo "DEPLOY_HOST=$runtime" >> "$GITHUB_ENV"
          echo "DATABASE_BASE_URL_OVERRIDE=$dburl" >> "$GITHUB_ENV"
          echo "NATS_URL_OVERRIDE=nats://$nats:4222" >> "$GITHUB_ENV"
      - name: Open deploy-only SSH access
        run: |
          set -euo pipefail
          ip=$(curl -fsS https://api.ipify.org)
          fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-production-runtime-fw"{print $1}')
          test -n "$fw"
          doctl compute firewall add-rules "$fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
      - name: Progressive production deployment
        timeout-minutes: 30
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: root
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_FINGERPRINT: MD5:40:5c:b9:ce:22:0e:16:26:48:09:0e:71:09:69:77:a5
          DATABASE_BASE_URL_OVERRIDE: ${{ env.DATABASE_BASE_URL_OVERRIDE }}
          NATS_URL_OVERRIDE: ${{ env.NATS_URL_OVERRIDE }}
          RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}
          PUBLIC_BASE_URL: https://api-talent.theraeburngroup.com
          UNIT_IMAGE_REF: ${{ needs.image.outputs.unit_image_ref }}
          SCANNER_IMAGE_REF: ${{ needs.image.outputs.scanner_image_ref }}
          IMAGE_ARCHIVE: release-images/release-images.tar.gz
          DEPLOY_RELEASE_ID: ${{ github.run_id }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-ssh.sh
      - name: Production smoke test
        id: smoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: https://api-talent.theraeburngroup.com
        run: node scripts/release-smoke.mjs
      - name: Automatic rollback
        if: steps.smoke.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: root
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_FINGERPRINT: MD5:40:5c:b9:ce:22:0e:16:26:48:09:0e:71:09:69:77:a5
          DATABASE_BASE_URL_OVERRIDE: ${{ env.DATABASE_BASE_URL_OVERRIDE }}
          NATS_URL_OVERRIDE: ${{ env.NATS_URL_OVERRIDE }}
          RUNTIME_ENV_FILE: ${{ secrets.RUNTIME_ENV_FILE }}
          PUBLIC_BASE_URL: https://api-talent.theraeburngroup.com
          UNIT_IMAGE_REF: ${{ needs.image.outputs.unit_image_ref }}
          SCANNER_IMAGE_REF: ${{ needs.image.outputs.scanner_image_ref }}
          ROLLBACK: "true"
        run: bash scripts/deploy-ssh.sh
      - name: Close deploy-only SSH access
        if: always()
        run: |
          set +e
          ip=$(curl -fsS https://api.ipify.org)
          fw=$(doctl compute firewall list --format ID,Name --no-header | awk '$2=="raeburn-talent-production-runtime-fw"{print $1}')
          [ -n "$fw" ] && doctl compute firewall remove-rules "$fw" --inbound-rules "protocol:tcp,ports:22,address:$ip/32"
          exit 0
      - if: steps.smoke.outcome == 'failure'
        run: exit 1

  publish-release:
    if: vars.PRODUCTION_ENABLED == 'true'
    needs: [qualify,production]
    runs-on: ubuntu-latest
    steps:
      - name: Publish immutable release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
          TAG: talent-v0.2.${{ github.run_number }}
        run: |
          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "$RELEASE_SHA"             --generate-notes             --title "Raeburn Talent $TAG"
