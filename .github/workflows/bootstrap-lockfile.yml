name: Lockfile verification
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/**/package.json"
      - "services/**/package.json"
      - "packages/**/package.json"
      - "connectors/**/package.json"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "apps/**/package.json"
      - "services/**/package.json"
      - "packages/**/package.json"
      - "connectors/**/package.json"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify deterministic install
        run: npm ci
      - name: Verify lockfile matches workspace manifests
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
