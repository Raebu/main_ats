name: Provision Production Infrastructure Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-production-once.yml"

permissions:
  contents: read

env:
  TOFU_VERSION: "1.10.6"
  TF_STATE_BUCKET: "raeburn-talent-terraform-state"
  TF_STATE_ENDPOINT: "https://e01b58b8d08d2c97284b2a46a13f3815.r2.cloudflarestorage.com"

jobs:
  apply:
    environment: production
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Verify production IaC credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_digitalocean_token TF_VAR_cloudflare_api_token TF_VAR_cloudflare_account_id; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production infrastructure credential is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure encrypted production state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/backend.hcl <<EOF
          bucket = "$TF_STATE_BUCKET"
          key    = "production/terraform.tfstate"
          region = "auto"
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          use_path_style              = true
          endpoints = {
            s3 = "$TF_STATE_ENDPOINT"
          }
          EOF
          tofu -chdir=infrastructure/terraform init -input=false -backend-config=/tmp/backend.hcl

      - name: Validate production infrastructure
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infrastructure/terraform
          tofu -chdir=infrastructure/terraform validate

      - name: Plan production infrastructure
        run: |
          set -euo pipefail
          tofu -chdir=infrastructure/terraform plan -input=false -out=/tmp/production.tfplan -var-file=production.tfvars.example
          tofu -chdir=infrastructure/terraform show -no-color /tmp/production.tfplan | tee /tmp/production-plan.txt

      - name: Apply production infrastructure
        run: |
          set -euo pipefail
          tofu -chdir=infrastructure/terraform apply -input=false -auto-approve /tmp/production.tfplan

      - name: Show production outputs
        run: |
          set -euo pipefail
          tofu -chdir=infrastructure/terraform output
