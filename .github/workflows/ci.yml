name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate:validate\n      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build:frontends
        env:
          TALENT_API_URL: http://127.0.0.1:4100
          TALENT_TENANT_ID: tenant_raeburn_group
          CAREERS_BASE_URL: https://theraeburngroup.com
      - run: npm audit --audit-level=high
