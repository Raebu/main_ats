name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.changed.outputs.workspaces }}
      has_workspaces: ${{ steps.changed.outputs.has_workspaces }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/changed-workspaces.mjs "$BASE_SHA" > changed.json
          echo "workspaces=$(cat changed.json)" >> "$GITHUB_OUTPUT"
          if [ "$(cat changed.json)" = "[]" ]; then echo "has_workspaces=false" >> "$GITHUB_OUTPUT"; else echo "has_workspaces=true" >> "$GITHUB_OUTPUT"; fi

  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:validate
      - run: npm run stage9:validate
      - run: npm run stage10:completion-gate
      - run: npm run stage11:completion-gate
      - run: npm run stage12:readiness-gate
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:frontends
        env:
          TALENT_API_URL: http://127.0.0.1:4100
          TALENT_TENANT_ID: tenant_raeburn_group
          CAREERS_BASE_URL: https://theraeburngroup.com
      - name: Build Storybook
        run: npm run storybook:build
      - run: npm audit --omit=dev --audit-level=high

  workspace-validation:
    needs: changes
    if: needs.changes.outputs.has_workspaces == 'true'
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate changed workspace
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          npm --workspace "$WORKSPACE" run test --if-present
          npm --workspace "$WORKSPACE" run typecheck --if-present
          npm --workspace "$WORKSPACE" run build --if-present

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start stateful dependencies
        run: docker compose -f infrastructure/docker-compose.yml up -d postgres pgbouncer nats
      - name: Bootstrap databases
        run: npm run platform:bootstrap
      - name: Start platform
        run: |
          nohup npm run platform:dev > /tmp/raeburn-platform.log 2>&1 &
          echo $! > /tmp/raeburn-platform.pid
      - name: Wait for gateway
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4100/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/raeburn-platform.log
          exit 1
      - run: npm run test:integration
      - run: npm run test:security-integration
      - run: npm run test:failure
      - run: npm run test:load
      - name: Logs on failure
        if: failure()
        run: cat /tmp/raeburn-platform.log || true
      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/raeburn-platform.pid || kill $(cat /tmp/raeburn-platform.pid) || true
          docker compose -f infrastructure/docker-compose.yml down -v

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL
        run: docker compose -f infrastructure/docker-compose.yml up -d postgres
      - name: Wait for PostgreSQL readiness
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infrastructure/docker-compose.yml exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose -f infrastructure/docker-compose.yml logs postgres
          exit 1
      - name: Bootstrap service databases
        run: npm run platform:bootstrap
      - name: Backup and restore jobs database
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infrastructure/docker-compose.yml exec -T postgres pg_dump -U postgres -Fc jobs > /tmp/jobs.dump
          test -s /tmp/jobs.dump
          docker compose -f infrastructure/docker-compose.yml exec -T postgres createdb -U postgres stage10_restore
          cat /tmp/jobs.dump | docker compose -f infrastructure/docker-compose.yml exec -T postgres pg_restore -U postgres --exit-on-error --no-owner --no-acl -d stage10_restore
          tables=$(docker compose -f infrastructure/docker-compose.yml exec -T postgres psql -U postgres -d stage10_restore -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          test "$tables" -gt 0
          docker compose -f infrastructure/docker-compose.yml exec -T postgres dropdb -U postgres stage10_restore
      - name: Cleanup
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infrastructure/docker-compose.yml up -d postgres pgbouncer nats
          nohup node scripts/s3-test-server.mjs >/tmp/raeburn-s3-test.log 2>&1 &
          echo $! >/tmp/raeburn-s3-test.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4566/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/raeburn-s3-test.log || true
          exit 1
      - name: Initialise private object storage
        env:
          R2_ENDPOINT: http://127.0.0.1:4566
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: raeburn-talent
          R2_FORCE_PATH_STYLE: "true"
        run: npm run object-storage:init
      - name: Bootstrap service databases
        run: npm run platform:bootstrap
      - name: Start backend platform
        run: |
          nohup env SKIP_FRONTENDS=true BOOTSTRAP_ADMIN_EMAIL=careers@theraeburngroup.com BOOTSTRAP_ADMIN_PASSWORD=change-me-local R2_ENDPOINT=http://127.0.0.1:4566 R2_ACCESS_KEY_ID=test R2_SECRET_ACCESS_KEY=test R2_BUCKET=raeburn-talent R2_FORCE_PATH_STYLE=true npm run platform:dev >/tmp/raeburn-browser-platform.log 2>&1 &
          echo $! >/tmp/raeburn-browser-platform.pid
      - name: Wait for API Gateway
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4100/health >/dev/null && curl -fsS http://127.0.0.1:4101/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/raeburn-browser-platform.log || true
          exit 1
      - name: Build frontends
        run: npm run build:frontends
        env:
          TALENT_API_URL: http://127.0.0.1:4100
          TALENT_TENANT_ID: tenant_raeburn_group
          CAREERS_BASE_URL: http://127.0.0.1:3001
      - name: Start frontends
        run: |
          nohup env PORT=3001 TALENT_API_URL=http://127.0.0.1:4100 TALENT_TENANT_ID=tenant_raeburn_group CAREERS_BASE_URL=http://127.0.0.1:3001 npm --workspace @raeburn/careers-web run start >/tmp/careers.log 2>&1 &
          nohup env PORT=3002 TALENT_API_URL=http://127.0.0.1:4100 npm --workspace @raeburn/talent-admin run start >/tmp/admin.log 2>&1 &
      - name: Wait for frontends
        shell: bash
        run: |
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3001/careers/accessibility >/dev/null && curl -fsS http://127.0.0.1:3002/login >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/careers.log || true
          cat /tmp/admin.log || true
          exit 1
      - name: Candidate, recruiter, privacy and accessibility E2E
        run: npm run test:e2e
        env:
          E2E_ADMIN_EMAIL: careers@theraeburngroup.com
          E2E_ADMIN_PASSWORD: change-me-local
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Browser logs on failure
        if: failure()
        run: |
          cat /tmp/raeburn-browser-platform.log || true
          cat /tmp/raeburn-s3-test.log || true
          cat /tmp/careers.log || true
          cat /tmp/admin.log || true
      - name: Browser test cleanup
        if: always()
        run: |
          test ! -f /tmp/raeburn-browser-platform.pid || kill $(cat /tmp/raeburn-browser-platform.pid) || true
          test ! -f /tmp/raeburn-s3-test.pid || kill $(cat /tmp/raeburn-s3-test.pid) || true
          docker compose -f infrastructure/docker-compose.yml down -v
